# =============================================================================
# Alembic configuration.
#
# Spec section 129: Alembic is the sole production schema authority.
# `Base.metadata.create_all()` is never used to manage a schema, and migrations
# run from an isolated one-shot service rather than on API boot.
#
# The database URL is NOT stored here. It is injected from application settings
# by migrations/env.py, so credentials live in exactly one place (.env) and can
# never drift between the app and the migration tool.
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamp-prefixed revision filenames sort chronologically in a directory
# listing, which makes a long migration history readable without opening files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate the long auto-generated slug so filenames stay usable on Windows.
truncate_slug_length = 40

# `version_path_separator` must be explicit: the default differs between
# platforms, and on Windows the legacy default (a space) would make a
# multi-path `version_locations` silently unparseable.
version_path_separator = os

# Do not emit DROP statements for objects Alembic cannot see (e.g. indexes
# created outside migrations); we want an explicit, reviewable diff.
compare_type = true
compare_server_default = true

[post_write_hooks]
# Format every generated migration so a hand-tweaked one stays lint-clean.
hooks = ruff_format ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
