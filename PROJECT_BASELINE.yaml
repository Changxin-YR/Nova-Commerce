# -----------------------------------------------------------------------------
# VERSION-SENSITIVE TECHNOLOGY BASELINE (spec section 151)
# Each entry records: pinned version, how the API surface was VERIFIED,
# and the concrete finding that constrains implementation.
# -----------------------------------------------------------------------------
protocol_baselines:

  mcp:
    sdk: "mcp==2.2.0 (Python)"
    verified_by: "live introspection of installed package + official SDK docs"
    latest_protocol_version: "2026-07-28"        # == spec section 12 baseline
    default_negotiated_version: "2025-03-26"     # legacy-compatible fallback
    jsonrpc_version: "2.0"
    unsupported_protocol_error_code: -32022
    protocol_version_meta_key: "io.modelcontextprotocol/protocolVersion"
    compatibility_strategy: |
      The official SDK natively supports BOTH the 2026-07-28 baseline and
      2025-era clients (DEFAULT_NEGOTIATED_VERSION=2025-03-26). Per spec
      section 12 we USE the SDK's native negotiation and do NOT hand-roll
      wire-protocol version handling or artificially break compatibility.
    breaking_api_delta_v1_to_v2:
      - "class renamed: FastMCP -> MCPServer (from mcp.server import MCPServer)"
      - "import path mcp.server.fastmcp REMOVED (ModuleNotFoundError on v2)"
    server_surface:
      class: "mcp.server.MCPServer"
      constructor_auth_params: ["token_verifier", "auth", "auth_server_provider"]
      transports: ["stdio", "streamable-http", "sse"]
      http_app_factory: "streamable_http_app()"
      run_kwargs: ["transport", "session_idle_timeout", "max_sessions"]
    auth_surface:                                  # satisfies spec section 87/90
      AuthSettings: ["issuer_url", "service_documentation_url", "required_scopes",
                     "resource_server_url", "validate_token_resource",
                     "client_registration_options", "revocation_options"]
      AccessToken: ["token", "client_id", "scopes", "expires_at", "resource",
                    "subject", "claims"]
      TokenVerifier: "async verify_token(token) -> AccessToken | None"
      middleware_chain: ["AuthenticationMiddleware(BearerAuthBackend)",
                         "AuthContextMiddleware", "RequireAuthMiddleware"]
      conclusion: >
        OAuth Resource Server semantics required by spec section 87
        (issuer / audience-resource / scope / expiry) are natively expressible.
        No custom wire protocol and no token passthrough are needed.
    transport_security_surface:                    # satisfies spec section 88
      module: "mcp.server.transport_security"
      TransportSecuritySettings:
        enable_dns_rebinding_protection: true
        allowed_hosts: "list[str]"
        allowed_origins: "list[str]"
      applicable_middleware: ["TransportSecurityMiddleware",
                              "RequestBodyLimitMiddleware"]
      default_max_request_body_size: "exposed as DEFAULT_MAX_REQUEST_BODY_SIZE"
    tool_schema_surface:                           # satisfies spec section 93
      Tool: ["name", "title", "description", "input_schema", "output_schema",
              "annotations", "meta", "icons", "execution"]
      ToolAnnotations: ["title", "read_only_hint", "destructive_hint",
                        "idempotent_hint", "open_world_hint"]
      CallToolResult: ["content", "structured_content", "is_error", "meta",
                       "result_type"]
      conclusion: "structuredContent + explicit input/output schema supported."
    client_surface:
      connect: "Client('http://host/mcp') for Streamable HTTP"
      stdio: "Client(StdioServerParameters(...))"
      in_memory: "Client(mcp_server_object) - used for compatibility tests"
      note: "no headers= kwarg; pass a configured httpx AsyncClient"

  langgraph:
    package: "langgraph==1.2.12"
    checkpoint_package: "langgraph-checkpoint==4.2.0"
    verified_by: "live introspection of installed package + official repo source"
    state_graph:
      signature: "StateGraph(state_schema, context_schema=None, *, input_schema=None, output_schema=None)"
      conclusion: >
        context_schema is the native run-scoped trusted-context mechanism
        required by spec section 70. Runtime[ContextT] is injected into nodes;
        it is NOT part of the mutable graph state, so the model cannot write it.
    runtime_context:
      class: "langgraph.runtime.Runtime"
      members: ["context", "store", "stream_writer", "previous", "execution_info",
                "server_info", "control", "heartbeat"]
    hitl:
      interrupt_signature: "interrupt(value: Any, *, response_schema=None) -> Any"
      command_fields: ["graph", "update", "resume", "goto", "PARENT"]
      CRITICAL_INVARIANT: >
        Official docstring: "The graph resumes from the start of the node,
        re-executing all logic." This is the exact hazard frozen by spec
        section 77. Therefore any non-idempotent persistence MUST live in a
        SEPARATE node that precedes the AwaitApproval node; the AwaitApproval
        node body must be side-effect-free before interrupt().
      enforced_by: ["FG-15", "FG-25", "tests/architecture/test_no_side_effects_in_await_approval.py"]
      multi_interrupt_note: >
        When >1 pending interrupt exists, resume MUST pass an interrupt-id map,
        else RuntimeError. V1 uses exactly one interrupt per approval point.
    checkpointer:
      dev: "langgraph.checkpoint.memory.InMemorySaver"
      prod: "langgraph-checkpoint-redis (planned 0.5.2)"
      prod_compat_verified: true
      prod_requirement: "langgraph-checkpoint>=4.1.1,<5.0.0 -> local 4.2.0 SATISFIED"
      fail_closed: "spec section 83 - missing checkpoint state must never degrade into execution"

  rag:
    mode_light: "API embeddings, reranker disabled - no GPU requirement"
    mode_full: "BGE-M3 dense + Qdrant sparse/BM25 + RRF + reranker"
    design_rule: "embedding dimension comes from provider metadata/config; never hardcoded"
    gpu_policy: >
      Heavy local models (sentence-transformers/onnxruntime/torch) live in the
      OPTIONAL extra [local-models]. Core install must serve without a GPU.
    degradation: "Qdrant/reranker down => policy questions return evidence-insufficient; business tools keep working (spec section 60)"

