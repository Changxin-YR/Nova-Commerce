tools:
  internal:                               # spec section 67 - exactly 27
    read:
      - product_search
      - product_get
      - product_get_internal
      - sku_get
      - inventory_get
      - inventory_metrics
      - order_get
      - order_search
      - fulfillment_get
      - after_sale_get
      - after_sale_eligibility
      - sales_metrics
      - product_performance
      - refund_metrics
      - business_anomaly_scan
      - knowledge_search
      - memory_get
    write_preview:
      - inventory_adjust_preview
      - order_cancel_preview
      - refund_preview
      - promotion_preview
    write:
      - inventory_adjust
      - order_cancel
      - refund_execute
      - promotion_create
      - memory_propose
  forbidden:                              # spec section 68
    - execute_sql
    - raw_sql
    - run_query
    - shell_exec
    - arbitrary_http
    - write_any_table
    - "any arbitrary Python execution tool"
  mcp_external:                           # spec section 91 - exactly 16
