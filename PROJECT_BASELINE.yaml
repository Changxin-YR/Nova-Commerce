    note: >
      Discovered by actually building the app, not by reading release notes. Each
      entry cost a real failed command.
    vite_8_is_rolldown: >
      Vite 8 builds with rolldown. The object form of `build.rollupOptions.output.manualChunks`
      is removed and fails with "Expected Function but received Object"; the replacement is
      `build.rolldownOptions.output.codeSplitting.groups`.
    tsconfig_baseUrl_removed: >
      `baseUrl` is a hard error (TS5101) from TS 6 onward. Paths are now tsconfig-relative.
    dev_server_ipv6_only: >
      The Vite dev server bound only to [::1]:5173, so 127.0.0.1 refused the connection -
      which would break Playwright, curl and anything containerised. Pinned `server.host`
      to 127.0.0.1, which also keeps the dev server off the LAN.
    openapi_typescript_peer: >
      openapi-typescript peers typescript ^5.x, so it stays out of package.json and runs
      via `npm run gen:api` against the live backend.
    backend_openapi_path: >
      The backend mounts OpenAPI at /api/openapi.json (not the FastAPI default
      /openapi.json). Everything that consumes it must use the real path.
    sass: "1.105.0"
    openapi-typescript: "7.13.0"

  infrastructure_images:
    mysql: "mysql:8.4"                    # verified 8.4.11
    redis: "redis:7.4-alpine"
    qdrant: "qdrant/qdrant:latest"
    minio: "quay.io/minio/minio:latest"   # Docker Hub minio/minio pull DENIED - see ADR-011
    keycloak: "quay.io/keycloak/keycloak:latest"
    nginx: "nginx:1.27-alpine"

  rejected_images:
