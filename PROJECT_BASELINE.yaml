    - phase: 15
      name: Docker / Observability / Deployment
      status: PENDING
    - phase: 16
      name: Documentation / Demo / Final Gate
      status: PENDING

  exit_criteria_per_phase:
    - Implement
    - Static Check
    - Migration (if schema changed)
    - Test
    - Run
    - Fix
    - Evidence
    - Update Docs
    - Commit-ready

# -----------------------------------------------------------------------------
# OPEN RISKS / DECISIONS REQUIRED
# -----------------------------------------------------------------------------
product_owner_decisions:
  - id: POD-001
    date: "2026-09-22"
    decision: "The product is named Nova."
    supersedes:
      - "Frozen spec section 2 (product name)"
      - "Frozen spec section 86 (MCP server id)"
    impact: >
      Product name, MCP server id, database name, bucket names, refresh-cookie
      name, Keycloak realm, Qdrant collection prefix and Redis key namespace all
      move to Nova. No architectural or behavioural change.
    recorded_because: >
      Section 86 *froze* an identifier. Overriding a frozen value is legitimate when
      the product owner directs it, but the override must be visible in the
      baseline rather than discovered later by diffing.

open_items:
  - id: RISK-001
    severity: RESOLVED
    title: "Product name conflict"
    detail: "Remote repo was Nova-Commerce; the frozen spec said Nexora Commerce."
    action_taken: "Product owner chose Nova; applied repo-wide. See POD-001."
  - id: RISK-002
    severity: HIGH
    title: "Python 3.14 host default is unusable for this stack"
    detail: "mingw sysconfig + missing cp314 wheels (onnxruntime etc.)."
    action_taken: "Pin venv to uv-managed CPython 3.11.16; record in baseline."
  - id: RISK-003
    severity: RESOLVED
    title: "MinIO official Docker Hub image is not pullable"
    detail: "docker.io/minio/minio returns pull access denied."
    action_taken: "Use quay.io/minio/minio. Verified pull + run. Recorded in ADR-011."
  - id: RISK-004
    severity: RESOLVED
    title: "MySQL 8.4 removed --default-authentication-plugin"
    detail: "Passing the legacy flag aborts startup (MY-000067)."
    action_taken: "Omit the flag; use utf8mb4 server defaults. Recorded in baseline smoke evidence."
  - id: RISK-005
    severity: RESOLVED
    title: "Frontend toolchain is far newer than common references"
    detail: >
      Confirmed real, not theoretical: TS 7 is incompatible with vue-tsc, Vite 8
      replaced manualChunks, baseUrl is a hard error, and the dev server bound to
      IPv6 only. Every one of these was hit during an actual build.
    action_taken: >
      Fixed and pinned; see dependency_versions.frontend_verified_constraints.
      typecheck + build + vitest + eslint + playwright all exit 0.
  - id: RISK-006
    severity: INFO
    title: "Git push credentials unverified"
    detail: "origin is configured; no credential helper is present on this host."
    action_taken: "Attempt push after the first commit; if rejected, deliver the commit locally and hand off."
