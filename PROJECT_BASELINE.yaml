# -----------------------------------------------------------------------------
# IMPLEMENTATION PLAN (spec section 142) - 17 phases
# -----------------------------------------------------------------------------
implementation_plan:
  # Phase list. Deliberately a list under a named key rather than a bare
  # sequence: it must coexist with `exit_criteria_per_phase` below, and YAML
  # forbids mixing a sequence and a mapping at the same level.
  phases:
    - phase: 0
      name: Audit + Baseline Lock
      status: COMPLETE
      deliverables: ["PROJECT_BASELINE.yaml", "docs/architecture/PHASE0_AUDIT.md", "docs/architecture/ARCHITECTURE_INVARIANTS.md", "docs/architecture/FINAL_GATE_INVENTORY.md", "docs/architecture/IMPLEMENTATION_PLAN.md", "ADR-013"]
    - phase: 1
      name: Skeleton + Infrastructure + MinIO
      status: PENDING
      deliverables: ["docker compose", "settings", "logging", "db session", "storage adapter", "alembic bootstrap", ".env.example", "health endpoints"]
    - phase: 2
      name: Identity + Auth Session + RBAC + DataScope
      status: PENDING
    - phase: 3
      name: Catalog + SKU + Inventory
      status: PENDING
    - phase: 4
      name: Cart + Pricing + Order
      status: PENDING
    - phase: 5
      name: Payment + Fulfillment + AfterSales + Refund
      status: PENDING
    - phase: 6
      name: Marketing + Analytics + Outbox
      status: PENDING
    - phase: 7
      name: Consumer Vue
      status: PENDING
    - phase: 8
      name: Merchant Console
      status: PENDING
    - phase: 9
      name: Tool Gateway
      status: PENDING
    - phase: 10
      name: LangChain / LangGraph
      status: PENDING
    - phase: 11
      name: Knowledge / RAG
      status: PENDING
    - phase: 12
