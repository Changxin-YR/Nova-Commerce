      error: "pull access denied for minio/minio, repository does not exist or may require 'docker login'"
      verified: true
      replacement: "quay.io/minio/minio:latest"
      replacement_verified_pull: true
      replacement_verified_run: true

# -----------------------------------------------------------------------------
# VERIFIED INFRASTRUCTURE SMOKE (Phase 0, real containers, real protocols)
# -----------------------------------------------------------------------------
infrastructure_smoke:
  executed_at: "2026-09-22"
  verdict: PASS
  checks:
    - service: mysql
      container: nx-mysql
      image: "mysql:8.4"
      measured_version: "8.4.11"
      command: "mysqladmin ping -uroot -p***"
      result: "mysqld is alive"
      charset: "utf8mb4"
      collation: "utf8mb4_0900_ai_ci"
      finding: >
        MySQL 8.4 REMOVED the --default-authentication-plugin server variable.
        Passing it aborts startup with MY-000067. Also aborts with MY-013236
        (unusable data directory) if the volume was previously half-initialised.
        V1 must not pass that flag.
    - service: redis
      container: nx-redis
      image: "redis:7.4-alpine"
      command: "redis-cli ping"
      result: PONG
      persistence: "appendonly yes"
    - service: qdrant
      container: nx-qdrant
      image: "qdrant/qdrant:latest"
      command: "GET /collections"
      result: '{"result":{"collections":[]},"status":"ok"}'
    - service: minio
      container: nx-minio
      image: "quay.io/minio/minio:latest"
      command: "GET /minio/health/live"
      result: "HTTP 200 (empty body by design)"
    - service: keycloak
      image: "quay.io/keycloak/keycloak:latest"
      result: "image pulled successfully (756MB); runtime validation deferred to Phase 1"

# -----------------------------------------------------------------------------
# FROZEN REQUIREMENT INVENTORY
# id -> spec section, statement, verification gate(s)
# "MUST" entries are non-negotiable; dropping one requires an ADR + user sign-off.
# -----------------------------------------------------------------------------
requirements:

  scope:
    REQ-SCOPE-001:
      spec: "§4"
      must: "Single-Merchant operation in V1 while reserving merchant_id on commercial data"
    REQ-SCOPE-002:
      spec: "§4"
      must: "One order belongs to exactly one merchant"
    REQ-SCOPE-003:
      spec: "§4"
      must_not: "No marketplace split-order / settlement / platform commission in V1"
    REQ-SCOPE-004:
      spec: "§5"
      must_not: >
        Must NOT add: Kafka, Kubernetes, microservices, service discovery, complex
        Saga, multi-merchant settlement, merchant onboarding, real Alipay/WeChat
        production payment, heavy ERP, heavy WMS, livestream, flash sale, group-buy,
        recommendation-model training, arbitrary SQL agent, mass autonomous multi-agent.

  architecture:
    REQ-ARCH-001: { spec: "§13", must: "Modular monolith with explicit bounded contexts" }
    REQ-ARCH-002:
      spec: "§14"
      must: "Strict layering: Controller|Agent|MCP -> Application Service/Workflow -> Repository -> Infrastructure"
    REQ-ARCH-003:
      spec: "§14"
      must_not: "Agent -> Repository / SQLAlchemy Session / MySQL; MCP -> Repository / MySQL; Controller -> SQL or multi-table business transaction"
    REQ-ARCH-004:
      spec: "§15"
      must: "Agent is never the business source of truth; order/payment/refund/inventory facts come from Business Service + Database"
    REQ-ARCH-005:
      spec: "§16"
      must: "Workflows drive deterministic commerce state transitions; LangGraph is NOT forced onto traditional commerce workflows"
    REQ-ARCH-006:
      spec: "§17"
      must_not: "Controller must not contain business logic, price algorithms, state machines, SQL or LLM decisions"
    REQ-ARCH-007:
      spec: "§18"
      must_not: "Repository must not contain Risk / Refund Policy / Promotion Policy / Permission / Workflow logic"
    REQ-ARCH-008: { spec: "§136", must: "The above boundaries are enforced by automated architecture tests", gate: "FG-25" }

  data:
    REQ-DATA-001: { spec: "§19", must: "MySQL 8.x, utf8mb4" }
    REQ-DATA-002: { spec: "§19", must: "Primary keys BIGINT UNSIGNED" }
    REQ-DATA-003: { spec: "§19", must: "Money is BIGINT minor units (cents); FLOAT/DOUBLE forbidden for transactional money" }
    REQ-DATA-004: { spec: "§19", must: "Datetime columns are DATETIME(3)" }
    REQ-DATA-005: { spec: "§19", must: "Statuses are VARCHAR + Python Enum" }
    REQ-DATA-006: { spec: "§19", must: "JSON only for snapshots, rule config, extension metadata, AI runtime metadata" }
    REQ-DATA-007: { spec: "§129", must: "Alembic is the only production schema authority; Base.metadata.create_all() forbidden as schema management" }
    REQ-DATA-008: { spec: "§129", must: "Migration runs as an isolated one-shot service; no auto-migrate on API boot" }

  identity_auth:
    REQ-AUTH-001: { spec: "§21", must: "Tables: merchants, users, auth_sessions, roles, permissions, user_roles, role_permissions, user_addresses" }
    REQ-AUTH-002: { spec: "§22", must: "auth_sessions persists refresh token HASH only (plus jti, expires_at, revoked_at, rotated_from, last_used_at)" }
    REQ-AUTH-003: { spec: "§22", must_not: "Plaintext refresh token must never be stored" }
    REQ-AUTH-004: { spec: "§23", must: "Short-lived access token; refresh token HttpOnly/Secure/SameSite; rotate on refresh" }
    REQ-AUTH-005: { spec: "§23", must_not: "Refresh token must not be persisted in localStorage long-term" }
    REQ-AUTH-006: { spec: "§23", must: "Refresh token rotation has tests", gate: "FG-13" }
    REQ-AUTH-007: { spec: "§24", must: "Seed merchant 'Nova Digital'; consumer user.merchant_id may be NULL; staff carry merchant_id" }

  catalog_inventory:
    REQ-CAT-001: { spec: "§25", must: "Tables: categories, brands, products, product_skus, product_images, product_attributes, sku_attribute_values" }
    REQ-CAT-002: { spec: "§25", must: "product_images stores object_key, not local filesystem paths" }
    REQ-INV-001: { spec: "§26", must: "Tables: warehouses, inventories, inventory_movements; one MAIN warehouse in V1" }
    REQ-INV-002: { spec: "§26", must: "Unique (warehouse_id, sku_id); CHECK available_qty >= 0 and locked_qty >= 0; has version column" }
    REQ-INV-003: { spec: "§27", must: "CreateOrder locks stock with MySQL SELECT ... FOR UPDATE in a SHORT transaction" }
    REQ-INV-004: { spec: "§27", must: "Background low-contention edits may use optimistic version locking" }
    REQ-INV-005: { spec: "§27", must_not: "Redis lock must NOT replace the single-MySQL core inventory transaction", gate: "FG-09" }
    REQ-INV-006:
      spec: "§28"
      must: "InventoryMovement is append-only and supports PURCHASE_IN, ORDER_LOCK, ORDER_RELEASE, ORDER_DEDUCT, RETURN_IN, MANUAL_ADJUST, DAMAGED_OUT"
    REQ-INV-007:
      spec: "§28"
      must: "Movement carries delta/before/after for available and locked, reference_type, reference_id, operator_type, operator_id, idempotency_key"

  commerce:
    REQ-CART-001: { spec: "§29", must: "Cart price is preview only; cart is not the transactional price source of truth" }
    REQ-ORD-001: { spec: "§30", must: "orders carries the full frozen column set incl. client_request_id, expires_at, version" }
    REQ-ORD-002: { spec: "§31", must: "order_status = PENDING_PAYMENT, PROCESSING, COMPLETED, CANCELLED, CLOSED" }
    REQ-ORD-003: { spec: "§31", must: "Payment success moves PENDING_PAYMENT -> PROCESSING; shipping NEVER changes order_status" }
    REQ-ORD-004: { spec: "§31", must: "Confirm-receipt moves PROCESSING -> COMPLETED" }
    REQ-ORD-005: { spec: "§31", must: "order_status must not duplicate payment/fulfillment facts" }
    REQ-ORD-006: { spec: "§31-§34", must: "Separate order/payment/fulfillment/after-sale status vocabularies exactly as frozen" }
    REQ-ORD-007: { spec: "§35", must: "OrderItem stores an immutable trade snapshot (product_name, sku_name, image ref, sku_snapshot, unit_price, quantities, allocated discounts)" }
    REQ-ORD-008: { spec: "§35", must: "Product edits must never mutate historical orders", gate: "FG-10 / mandatory-4" }
    REQ-ORD-009: { spec: "§36", must: "order_status_logs is append-only and records only top-level order_status transitions" }
    REQ-PRI-001: { spec: "§37", must: "PricingService is the single price authority: calculate_item_price, calculate_cart_price, apply_promotion, apply_coupon, calculate_shipping, build_price_snapshot" }
    REQ-PRI-002: { spec: "§38", must: "CreateOrder accepts only sku_id, quantity, coupon_id, address_id style inputs; server recomputes all money" }
    REQ-PRI-003: { spec: "§38", must_not: "Client-supplied unit_price / discount_amount / payable_amount must never be trusted as the deal basis" }
    REQ-PRI-004: { spec: "§41", must: "Order-level discount is allocated pro-rata by item original amount, remainder absorbed by the last item" }
    REQ-PRI-005: { spec: "§41", must: "sum(order_items.payable_amount) == orders.payable_amount (INV-006)" }

  marketing:
    REQ-MKT-001: { spec: "§39", must: "promotions + promotion_products; types DIRECT_DISCOUNT, PERCENT_DISCOUNT, FULL_REDUCTION; promotion_type + rule_config; Strategy Pattern" }
    REQ-MKT-002: { spec: "§40", must: "coupon_templates, user_coupons, coupon_usage_records; states UNUSED, LOCKED, USED, EXPIRED" }
    REQ-MKT-003: { spec: "§40", must: "Order creation LOCKS the coupon; payment confirmation marks USED; cancellation releases; concurrency must be handled" }
    REQ-MKT-004: { spec: "§47", must: "Promotion creation MUST be previewed first" }

  payment:
    REQ-PAY-001: { spec: "§42", must: "payments: payment_no UNIQUE, order_id, channel, amount, status, external_transaction_no, idempotency_key" }
    REQ-PAY-002: { spec: "§43", must: "payment_callbacks: provider, provider_event_id, payment_no, payload_snapshot, signature_valid, process_status, received_at, processed_at; UNIQUE(provider, provider_event_id)" }
    REQ-PAY-003: { spec: "§43", must: "Callback snapshot must be sensitive-field filtered; secrets never stored" }
    REQ-PAY-004: { spec: "§44", must: "Duplicate callback produces exactly one business effect: one payment confirm, one inventory effect, one fulfillment, no duplicate outbox side effect", gate: "FG-11" }
    REQ-PAY-005: { spec: "§97", must: "Mock payment endpoints exist ONLY in DEV/DEMO; providers use a separate auth model; a normal JWT user must never be able to set payment success" }
    REQ-PAY-006: { spec: "§112", must: "Payment success can never originate from a user or agent assertion (INV-008)" }

  fulfillment:
    REQ-FUL-001: { spec: "§45", must: "fulfillments + fulfillment_items; one order may ship multiple packages" }
    REQ-FUL-002: { spec: "§45", must: "fulfillment_items: fulfillment_id, order_item_id, quantity" }

  aftersales:
    REQ-AFS-001: { spec: "§46", must: "after_sales (business claim) and refunds (money fact) are SEPARATE tables/domains" }
    REQ-AFS-002: { spec: "§46", must: "Total refunded <= paid amount; item refund <= item payable amount", gate: "FG-12" }

  consistency:
    REQ-CON-001: { spec: "§48", must: "idempotency_records: scope, idempotency_key, request_hash, status, response_code, response_snapshot, expires_at" }
    REQ-CON-002: { spec: "§48", must: "response_snapshot stores only non-sensitive summaries; never tokens/secrets/full PII" }
    REQ-CON-003: { spec: "§49", must: "Transactional outbox: business rows + outbox row commit in ONE transaction; worker publishes afterwards; retry with next_retry_at" }
    REQ-CON-004: { spec: "§50", must: "Async reconciliation covers expired orders, outbox retry, expired coupons, expired pending actions, knowledge ingestion recovery" }
    REQ-CON-005: { spec: "§50", must: "A Celery task is never the sole source of business truth" }

  storage:
    REQ-STO-001: { spec: "§20", must: "MinIO/S3-compatible storage for product images, knowledge originals, downloadable reports, large evidence artifacts" }
    REQ-STO-002: { spec: "§20", must_not: "MySQL must not store large BLOBs" }
    REQ-STO-003: { spec: "§20", must: "DB stores object_key, checksum, content_type, size, metadata" }
    REQ-STO-004: { spec: "§20", must: "Knowledge documents use a private bucket by default; product images via controlled public or signed URL" }
    REQ-STO-005: { spec: "§20", must_not: "Persistent business files must not rely on container-local filesystem", gate: "FG-19" }

  knowledge_rag:
    REQ-RAG-001: { spec: "§51", must: "knowledge_bases, knowledge_documents, knowledge_chunks with the frozen column set incl. embedding_model, embedding_version, chunk_strategy_version, failure_reason, indexed_at" }
    REQ-RAG-002: { spec: "§52", must: "Ingestion pipeline: upload -> MIME/extension/signature validation -> size limit -> object storage -> SHA256 -> duplicate check -> PROCESSING -> outbox -> worker -> safe parse -> clean -> structure-aware chunk -> metadata -> embedding -> Qdrant -> READY" }
    REQ-RAG-003: { spec: "§52", must: "Parsing must limit file size, page count and runtime; must defend against path traversal" }
    REQ-RAG-004: { spec: "§53", must: "States UPLOADED, PROCESSING, READY, FAILED, ARCHIVED; archived docs excluded from retrieval and synced to Qdrant payload/active filter" }
    REQ-RAG-005: { spec: "§54", must: "Chunking is structure-aware per document type; a global fixed 500/50 is forbidden" }
    REQ-RAG-006: { spec: "§55", must: "RAG metadata carries the full frozen field set incl. merchant_id, version, valid_from/valid_to, checksum, source reference" }
    REQ-RAG-007: { spec: "§56", must: "Full pipeline: normalize -> rewrite -> entity extraction -> metadata filter -> dense + sparse -> RRF -> candidate set -> rerank -> top evidence -> evidence validation -> citation" }
    REQ-RAG-008: { spec: "§56/§57", must: "All TopK / candidate / rerank parameters are configuration, never scattered literals" }
    REQ-RAG-009: { spec: "§57", must: "Provider abstraction for embedding/reranker; system must run without GPU (RAG_MODE=light)" }
    REQ-RAG-010: { spec: "§58", must: "LLM may only cite Evidence IDs; CitationBuilder resolves Evidence ID -> document/section/page/version" }
    REQ-RAG-011: { spec: "§59", must: "Visibility PUBLIC/CUSTOMER/STAFF/ADMIN enforced by retriever as permission + metadata filter" }
    REQ-RAG-012: { spec: "§60", must: "Retriever outage => refuse to guess for policy questions; business tools keep working", gates: "FG-16, FG-17" }
    REQ-RAG-013: { spec: "§120", must: "evals/rag/rag_eval_v1.jsonl with >= 50 cases; metrics Recall@5, MRR, nDCG@10, No-answer Accuracy, Citation Accuracy; compare dense / sparse / hybrid / hybrid+rerank", gate: "FG-16" }

  agent:
    REQ-AGT-001: { spec: "§61", must: "agent_threads, agent_messages, agent_runs, agent_tool_calls, agent_memories" }
    REQ-AGT-002: { spec: "§62", must: "Thread=conversation, Run=execution, Message=real chat; checkpoint store is NOT the permanent chat database; delete-thread is Archive/Hide; run facts are never deleted" }
    REQ-AGT-003: { spec: "§63", must: "agent_runs carries the full frozen field set incl. graph_version, prompt_version, tool_registry_version, rag_pipeline_version, tokens, latency" }
    REQ-AGT-004: { spec: "§64", must: "agent_tool_calls snapshots are redacted before persistence (no token/secret/password/unnecessary PII)" }
    REQ-AGT-005: { spec: "§65", must: "ai_tools table + code registry as canonical security metadata; risk_level, required_permission, is_write, enabled, mcp_exposed" }
    REQ-AGT-006: { spec: "§65", must_not: "A normal console user must not be able to downgrade a CRITICAL write tool to READ" }
    REQ-AGT-007: { spec: "§66", must: "Tool pipeline order: Resolve Trusted Context -> Exists -> Enabled -> Agent Allowlist -> Permission -> DataScope -> Pydantic Input -> Risk -> HITL -> Service/Workflow -> Output Validation -> Redaction -> Audit -> Agent" }
    REQ-AGT-008: { spec: "§67", must: "The 27 frozen internal tool names must exist" }
    REQ-AGT-009: { spec: "§68", must_not: "No execute_sql / raw_sql / run_query / shell_exec / arbitrary_http / write_any_table / arbitrary Python execution tool" }
    REQ-AGT-010: { spec: "§69", must: "Effective tools = Agent Allowlist INTERSECT User Permission INTERSECT Runtime Enabled" }
    REQ-AGT-011: { spec: "§69", must: "Analytics agent NEVER has write tools", gates: "FG-14, mandatory-6" }
    REQ-AGT-012: { spec: "§70", must: "Trusted run-scoped context (trace_id, request_id, user_id, merchant_id, roles, permissions, data_scope, source, agent_run_id) originates from the backend and cannot be modified by the model" }
    REQ-AGT-013: { spec: "§71", must: "Commerce Agent state carries the frozen field set" }
    REQ-AGT-014: { spec: "§72", must: "Supervisor only does Initialize, InputGuard, Memory Load, Intent, Route, Subgraph, ResponseGuard, Persist - not a universal super-agent" }
    REQ-AGT-015: { spec: "§73/§74/§75", must: "Service / Operations / Analytics graphs expose the frozen node sets; Analytics is strictly read-only" }
    REQ-AGT-016: { spec: "§76", must: "Budget is configuration: plan steps <= 6, tool calls <= 12, replan <= 2, param repair <= 2, same-tool consecutive failure <= 3; budget exhaustion stops the run" }
    REQ-AGT-017: { spec: "§77", must: "CreatePendingAction is a SEPARATE node from AwaitApproval; the AwaitApproval node must have no non-idempotent side effect before interrupt()", gate: "FG-15" }
    REQ-AGT-018: { spec: "§78", must: "pending_actions carries the frozen field set and the 7-state lifecycle" }
    REQ-AGT-019: { spec: "§79", must: "All agent write tools in V1 require human approval: Preview -> Proposal -> Risk -> CreatePendingAction -> interrupt -> Resume -> Revalidate -> Execute" }
    REQ-AGT-020: { spec: "§80", must: "After approval, re-read real business facts (order status, price, cost, stock, permission, data scope, refund amount, promotion conflict) - never blind-execute the old proposal" }
    REQ-AGT-021: { spec: "§81", must: "Risk engine is deterministic with READ/LOW/MEDIUM/HIGH/CRITICAL; CRITICAL agent actions are BLOCKED; the LLM is never the final risk authority", gates: "FG-26, mandatory-13" }
    REQ-AGT-022: { spec: "§82", must: "Any success claim requires an ExecutionReceipt (success, action_type, resource_type, resource_id, workflow_id, executed_at, trace_id)" }
    REQ-AGT-023: { spec: "§83", must: "MemorySaver in dev, Redis checkpointer in prod (with persistence + volume); MySQL PendingAction/business state remains the key fact; missing checkpoint => fail closed" }
    REQ-AGT-024: { spec: "§84", must_not: "Memory must never store live inventory, order status, price, permissions or payment facts" }
    REQ-AGT-025: { spec: "§85", must: "SSE streaming with the 12 allowed event names and no hidden chain-of-thought emission" }

  mcp:
    REQ-MCP-001: { spec: "§86", must: "Server id nova-commerce-mcp; stdio + Streamable HTTP; remote path /mcp; implemented on the official SDK" }
    REQ-MCP-002: { spec: "§87", must: "OAuth Resource Server mode; verify issuer, signature, expiry, audience/resource, scope; NO token passthrough", gate: "FG-18" }
    REQ-MCP-003: { spec: "§88", must: "Origin validation, Host/allowed-host protection, TLS, rate limit, timeout; no insecure local dev binding in production" }
    REQ-MCP-004: { spec: "§89", must: "MCP context only from verified identity (client_id, user_id, merchant_id, scope, roles, permissions, data_scope, source=MCP); tool parameters must NOT accept user_id/merchant_id/is_admin/permissions" }
    REQ-MCP-005: { spec: "§90", must: "Effective permission = OAuth scope INTERSECT RBAC INTERSECT DataScope INTERSECT tool policy; tools/list filtered by authorization; tools/call re-authorized" }
    REQ-MCP-006: { spec: "§91", must: "The 16 frozen MCP tool names must exist" }
    REQ-MCP-007: { spec: "§92", must_not: "External MCP exposes no refund.execute / inventory.adjust / order.force_update / promotion.create / RBAC update / DataScope update" }
    REQ-MCP-008: { spec: "§92", must: "nova.promotion.propose only creates a PendingAction and never creates a Promotion directly", gate: "FG-18" }
    REQ-MCP-009: { spec: "§93", must: "Every tool declares explicit input schema, output schema, description and read/write semantics; prefer structuredContent" }
    REQ-MCP-010: { spec: "§12", must: "Do not hand-write the MCP wire protocol; use the official SDK; record SDK version, supported protocol revisions, Streamable HTTP lifecycle, stdio behaviour, auth behaviour, legacy-client strategy" }
    REQ-MCP-011: { spec: "§12", must: "A protocol baseline change requires an ADR + compatibility test" }

  security:
    REQ-SEC-001: { spec: "§94", must: "Purpose-based minimisation before LLM/MCP/trace/audit snapshot; mask phone/email/address by default" }
    REQ-SEC-002: { spec: "§94/§132", must_not: "Never log or persist passwords, access tokens, refresh tokens, API keys, client secrets, DB passwords, hidden chain-of-thought" }
    REQ-SEC-003: { spec: "§109", must: "Address JWT tampering, expired token, refresh reuse, CSRF, CORS, SQL injection, XSS, path traversal, upload spoofing, oversized upload, IDOR, mass assignment, rate limit, brute force, prompt injection, MCP privilege escalation" }
    REQ-SEC-004: { spec: "§110", must: "Pydantic request schemas explicitly declare mutable fields; ORM(**request.dict()) mass assignment is forbidden" }
    REQ-SEC-005: { spec: "§134", must: ".env never committed; .env.example provided; a secret scan is part of the final gate (FAIL on finding)", gate: "FG-24" }
    REQ-SEC-006: { spec: "§125/§147", must: "Critical-risk injection demo must be BLOCKED with an audit record and no dangerous DB change", gate: "FG-26" }

  api:
    REQ-API-001: { spec: "§95", must: "Uniform envelope under /api/v1 returning code, message, data, trace_id with stable business error codes" }
    REQ-API-002: { spec: "§96", must: "Order endpoints: POST /orders/preview, POST /orders, GET /orders, GET /orders/{order_no}, POST /orders/{order_no}/cancel, POST /orders/{order_no}/confirm-receipt; create uses Idempotency-Key + client_request_id" }
    REQ-API-003: { spec: "§98", must: "Admin API covers products, SKU, inventory, inventory movements, orders, fulfillment, after-sales, refund, promotion, coupon, analytics, knowledge, AI runs, pending actions, audit" }
    REQ-API-004: { spec: "§99", must: "Task-based endpoints (/publish, /unpublish, /cancel, /ship, /approve, /reject, /confirm-receipt); avoid arbitrary PATCH status" }
    REQ-API-005: { spec: "§141", must: "OpenAPI is generatable and persisted as a build artifact; frontend types generated or validated from it" }

  frontend:
    REQ-FE-001: { spec: "§6", must: "Vue 3 + TypeScript + Vite + Vue Router + Pinia + Element Plus + ECharts + Axios + SSE; <script setup lang=\"ts\"> everywhere" }
    REQ-FE-002: { spec: "§100", must: "Consumer routes (Home, Search, Product, Cart, Checkout, MockPay, Orders, OrderDetail, AfterSales, Profile, Addresses, AI Assistant) and Console routes (Dashboard, Products, Inventory, Orders, AfterSales, Marketing, Analytics, AI, Knowledge, System)" }
    REQ-FE-003: { spec: "§101", must: "AI Workspace: Assistant, Operations, Analytics, Pending Actions, Agent Runs; message blocks Text/Metric/Table/Chart/Citation/ToolProgress/ActionProposal/Error" }
    REQ-FE-004: { spec: "§102", must: "Agent emits a ChartSpec; the frontend renderer converts it to ECharts; agent must never emit executable JavaScript" }
    REQ-FE-005: { spec: "§103", must: "Knowledge Center: bases, documents, retrieval debug (rewrite, filter, dense, sparse, fusion, rerank, final evidence), RAG evaluation" }
    REQ-FE-006: { spec: "§104", must: "Route/menu/button permission is UX only; real authorization is always server-side" }
    REQ-FE-007: { spec: "§105", must: "Pinia holds only genuinely cross-page state: auth, permission, cart, app, aiThread, notification" }
    REQ-FE-008: { spec: "§106", must: "Unified src/api/ layer over one HTTP client handling auth, refresh, trace, timeout, error mapping" }
    REQ-FE-009: { spec: "§107", must: "Money/status/request/response types stay consistent with the backend contract" }
    REQ-FE-010: { spec: "§108", must: "Core pages implement Loading/Success/Empty/Error/PermissionDenied; agent adds Streaming/WaitingApproval/Failed/Cancelled; knowledge adds Processing/Failed" }

  ops:
    REQ-OPS-001: { spec: "§128", must: "Compose services: nginx, api, worker, scheduler, mcp, mysql, redis, qdrant, minio, oauth-provider; optional observability profile; observability is never a hard startup dependency" }
    REQ-OPS-002: { spec: "§130", must: "/health/live and /health/ready; MySQL critical, Redis important, Qdrant/LLM/reranker/MCP degradable" }
    REQ-OPS-003: { spec: "§131", must: "Structured JSON logs, OTel traces/metrics, business audit, agent trace; trace_id propagates across HTTP, workflow, agent, tool, Celery, MCP, audit" }
    REQ-OPS-004: { spec: "§133", must: "Audit is separate from logs, append-only, with the frozen field set incl. masked before/after snapshots" }
    REQ-OPS-005: { spec: "§135", must: "Backend: import/startup check, Ruff, pytest, migration. Frontend: vue-tsc, Vitest, Vite build, Playwright. Dependency scan with pip-audit/npm audit; unaddressed critical vulns need documented blocking evidence" }
    REQ-OPS-006: { spec: "§8", must: "OAuth/OIDC provider: Keycloak preferred for the demo; any replacement requires a documented reason" }

  delivery:
    REQ-DOC-001: { spec: "§137", must: "README.md plus docs/architecture/{SYSTEM_ARCHITECTURE,DOMAIN_MODEL,DATABASE,ORDER_WORKFLOW,AGENT_RUNTIME,RAG_ARCHITECTURE,MCP_SECURITY,SECURITY_MODEL,STORAGE,OBSERVABILITY}.md, docs/DEPLOYMENT.md, docs/demo/, docs/adr/" }
    REQ-DOC-002: { spec: "§138", must: "ADR-001 .. ADR-014 as frozen" }
    REQ-DOC-003: { spec: "§139", must: "README first screen explains the problem solved - commerce system + controlled agent operations - not a framework list" }
    REQ-DOC-004: { spec: "§140", must: "docs/demo/DEMO_01_COMMERCE.md .. DEMO_05_SECURITY.md" }
    REQ-EVD-001: { spec: "§144", must: "artifacts/evidence/ covering build, migration, unit, integration, concurrency, auth, agent, rag, mcp, security, storage, e2e, docker, final; each with command, timestamp, exit_code, stdout/stderr, machine-readable report, summary; regenerable by script; no secrets" }
    REQ-EVD-002: { spec: "§145", must: "FINAL_GATE.md is an evidence INDEX only and is never itself evidence" }
    REQ-DEF-001: { spec: "§143", must: "Per phase: Implement -> Static Check -> Migration -> Test -> Run -> Fix -> Evidence -> Docs -> commit-ready, before advancing" }
    REQ-DEF-002: { spec: "§149", must: "No theoretical completion; status must be backed by real execution results" }

# -----------------------------------------------------------------------------
# ARCHITECTURE INVARIANT INVENTORY (spec section 112) - verbatim and frozen
# Each invariant maps to the automated check that proves it.
# -----------------------------------------------------------------------------
architecture_invariants:
  - id: INV-001
    statement: "available_qty >= 0 at all times"
    enforced_by: ["DB CHECK constraint", "FK9 inventory concurrency gate", "pytest tests/concurrency"]
  - id: INV-002
    statement: "locked_qty >= 0 at all times"
    enforced_by: ["DB CHECK constraint", "tests/concurrency"]
  - id: INV-003
    statement: "The same stock cannot be deducted twice"
    enforced_by: ["inventory_movements.idempotency_key UNIQUE", "FK-11"]
  - id: INV-004
    statement: "The same payment event produces exactly one business effect"
    enforced_by: ["UNIQUE(provider, provider_event_id)", "payments.idempotency_key", "FK-11"]
  - id: INV-005
    statement: "refunded_amount <= paid_amount"
    enforced_by: ["RefundService guard", "DB CHECK", "FK-12"]
  - id: INV-006
    statement: "Order.payable_amount == sum(OrderItem.payable_amount)"
    enforced_by: ["allocation algorithm", "FK-10", "tests/integration/test_order_amount_invariant.py"]
  - id: INV-007
    statement: "InventoryMovement fully explains every stock change"
    enforced_by: ["before/after columns", "reconciliation job", "FK-09"]
  - id: INV-008
    statement: "Payment success can never come from a user or agent assertion"
    enforced_by: ["callback signature verification", "mock pay dev-only", "FK-14"]
  - id: INV-009
    statement: "An unapproved PendingAction can never write business data"
    enforced_by: ["tool gateway", "pending_actions state machine", "FK-15"]
  - id: INV-010
    statement: "Agent effective permission is always a subset of the current user's permission"
    enforced_by: ["ToolGateway authorization intersection", "FK-14"]
  - id: INV-011
    statement: "The Analytics agent can never write"
    enforced_by: ["per-agent allowlist", "architecture test asserting no write tool in analytics registry", "FK-14/FG-25"]
  - id: INV-012
    statement: "MCP scope can never bypass RBAC or DataScope"
    enforced_by: ["MCP ToolGateway intersection", "FK-18"]
  - id: INV-013
    statement: "Retrieved RAG content can never trigger a business write"
    enforced_by: ["evidence is data-not-instruction", "no write tool reachable from knowledge path", "FK-17"]
  - id: INV-014
    statement: "Historical order snapshots are unaffected by later product changes"
    enforced_by: ["OrderItem snapshot columns", "FK-10"]
  - id: INV-015
    statement: "The same Idempotency-Key never produces a duplicate result"
    enforced_by: ["idempotency_records UNIQUE(scope, idempotency_key)", "FK-08/FG-11"]
  - id: INV-016
    statement: "After refresh rotation the previous refresh token is no longer valid"
    enforced_by: ["auth_sessions.rotated_from + revoked_at", "FK-13"]
  - id: INV-017
    statement: "If the object does not exist in storage, the database must never pretend READY"
    enforced_by: ["ingestion existence re-check", "FK-19"]
  - id: INV-018
    statement: "A LangGraph resume never repeats a business side effect"
    enforced_by: ["CreatePendingAction / AwaitApproval split", "idempotent node bodies", "FK-15", "FG-25"]

# -----------------------------------------------------------------------------
# WORKFLOW INVENTORY (spec section 16)
# -----------------------------------------------------------------------------
workflows:
  deterministic:
    - name: CreateOrderWorkflow
      trigger: "POST /api/v1/orders"
      steps: ["idempotency guard", "recompute price via PricingService", "lock coupon", "SELECT FOR UPDATE on inventories", "reserve stock + ORDER_LOCK movement", "persist order + items + snapshot", "emit outbox"]
    - name: CancelOrderWorkflow
      steps: ["state guard", "release coupon", "release stock + ORDER_RELEASE movement", "order_status=CANCELLED", "outbox"]
    - name: PaymentSuccessWorkflow
      trigger: "verified provider callback"
      steps: ["callback idempotency", "payment=SUCCESS", "order PENDING_PAYMENT->PROCESSING", "ORDER_DEDUCT movement", "create fulfillment shell", "outbox"]
    - name: ShipWorkflow
      steps: ["fulfillment create", "fulfillment_status transitions", "order_status UNCHANGED"]
    - name: ConfirmReceiptWorkflow
      steps: ["PROCESSING -> COMPLETED"]
    - name: AfterSaleWorkflow
      steps: ["eligibility", "after_sales record", "refund preview"]
    - name: RefundWorkflow
      steps: ["revalidate paid/refunded", "refund row", "payment_status transition", "after_sale_status transition", "outbox"]
    - name: InventoryAdjustWorkflow
      steps: ["optimistic version check", "movement append", "metrics refresh"]
    - name: CreatePromotionWorkflow
      steps: ["preview", "risk", "pending action approval", "promotion + promotion_products"]
  agentic:
    - name: SupervisorGraph
      nodes: ["Initialize", "InputGuard", "Memory Load", "Intent", "Route", "Subgraph", "ResponseGuard", "Persist"]
    - name: ServiceGraph
      nodes: ["UnderstandRequest", "ResolveEntity", "ClassifyTask", "Knowledge/Business Tool", "Merge Evidence", "Preview", "Proposal", "Risk", "PendingAction", "AwaitApproval", "Revalidate", "ExecuteWorkflow", "Verify", "Audit", "Compose", "GroundingCheck"]
    - name: OperationsGraph
      nodes: ["UnderstandGoal", "BuildPlan", "ValidatePlan", "ExecutePlan", "Parallel Tools", "CollectEvidence", "EvaluateEvidence", "Replan", "GenerateInsight", "ActionRequested", "GenerateProposal", "Preview", "RiskCheck", "PendingAction", "AwaitApproval", "Revalidate", "Execute", "Verify", "Audit", "Answer"]
    - name: AnalyticsGraph
      nodes: ["UnderstandQuestion", "BuildMetricPlan", "ValidatePlan", "FanOut", "AggregateEvidence", "ValidateEvidence", "Replan", "AnalyzeDrivers", "GenerateInsight", "BuildChartSpec", "GroundingCheck"]
      read_only: true

