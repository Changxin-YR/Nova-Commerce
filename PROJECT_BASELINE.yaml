# -----------------------------------------------------------------------------
# TEST INVENTORY (spec section 111)
# -----------------------------------------------------------------------------
tests:
  backend: ["pytest", "pytest-asyncio", "httpx ASGITransport"]
  frontend: ["Vitest", "Vue Test Utils", "Playwright"]
  integration_requires_real: ["MySQL", "Redis", "Qdrant", "MinIO"]
  ai_unit: "Fake/Mock LLM for deterministic CI"
  ai_real: "manual/scheduled only, never a hard PR dependency"
  suites:
    - path: tests/unit
      marker: unit
    - path: tests/integration
      marker: integration
      requires: [mysql, redis]
    - path: tests/concurrency
      marker: concurrency
      requires: [mysql]
    - path: tests/security
      marker: security
    - path: tests/architecture
      marker: architecture
      gate: FG-25
    - path: tests/e2e
      marker: e2e
      requires: [all]
  eval_sets:
    - path: evals/rag/rag_eval_v1.jsonl
      min_cases: 50
      gate: FG-16
    - path: evals/agent/agent_eval_v1.jsonl
      gate: FG-22

# -----------------------------------------------------------------------------
# FINAL GATE INVENTORY (spec section 146) - 26 gates
# -----------------------------------------------------------------------------
final_gates:
  - id: FG-01
    name: Repository State Audit
    proof: "artifacts/evidence/final/fg01_repo_state.json"
  - id: FG-02
    name: Backend Static / Startup Check
    proof: "artifacts/evidence/build/fg02_backend_static.txt"
  - id: FG-03
    name: Frontend Typecheck + Build
    proof: "artifacts/evidence/build/fg03_frontend_build.txt"
  - id: FG-04
    name: Docker Build
    proof: "artifacts/evidence/docker/fg04_docker_build.txt"
  - id: FG-05
    name: Alembic Migration
    proof: "artifacts/evidence/migration/fg05_alembic.txt"
  - id: FG-06
    name: Seed Idempotency
    proof: "artifacts/evidence/migration/fg06_seed_idempotency.json"
