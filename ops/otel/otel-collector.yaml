# Minimal collector config. Phase 15 expands this; the point of having it now is
# that the `observability` profile is startable, so spec section 128 ("never a
# hard startup dependency") is verifiable rather than aspirational.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }